<!DOCTYPE html>
<html lang="en">
<head><title>Starlink</title>
</head>
<body>
    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
        
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.SphereGeometry( 1, 64, 32 );
        const material = new THREE.MeshBasicMaterial( { color: 0x778873 } );
        const sphere = new THREE.Mesh( geometry, material );
        scene.add( sphere );

        function animate() {
            requestAnimationFrame(animate);
            sphere.rotation.x += 0.01;
            sphere.rotation.y += 0.01;
            renderer.render(scene, camera);
        }
        animate();

        camera.position.z = 5;



        const response = await fetch('/starlink.txt');
        const text = await response.text();
        const lines = text.split("\n").map(line => line.trim());

        const satellites = [];

        console.log(lines.length)

        for (let i = 0; i < lines.length; i += 3) {
            satellites.push({ name: lines[i], line1: lines[i+1], line2: lines[i+2] })
        }

        console.log(satellites.slice(0, 7))




    </script>
    
</body>
</html>
